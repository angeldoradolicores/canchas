networks:
  cancheros-net:
    name: cancheros-net
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
  postgres_data:
  redis_data:
  evolution_instances:
  evolution_store:
  n8n_data:

services:
  # -------------------------------------------------------------
  # 1. NGINX PROXY MANAGER (Único punto de entrada público)
  # -------------------------------------------------------------
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"     
      - "443:443"   
      - "127.0.0.1:81:81"  # Blindado solo para acceso local / SSH tunnel
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - cancheros-net

  # -------------------------------------------------------------
  # 2. BASE DE DATOS (PostgreSQL para Evolution API)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVO_DB_NAME}
      POSTGRES_USER: ${EVO_DB_USER}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVO_DB_USER} -d ${EVO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cancheros-net

  # -------------------------------------------------------------
  # 3. CACHÉ & COLAS (Redis con Contraseña Interna)
  # -------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - cancheros-net

  # -------------------------------------------------------------
  # 4. EVOLUTION API v2 (Sin puertos públicos, 100% protegida)
  # -------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=https://evolution.cancheros.duckdns.org
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      # Base de Datos apuntando al contenedor interno
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVO_DB_USER}:${EVO_DB_PASSWORD}@evolution-postgres:5432/${EVO_DB_NAME}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # Redis Cache apuntando al contenedor interno
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - WEBSOCKET_ENABLED=true
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - cancheros-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # -------------------------------------------------------------
  # 5. n8n (Sin puertos expuestos + Podado automático de disco)
  # -------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.cancheros.duckdns.org
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.cancheros.duckdns.org/
      - N8N_EDITOR_BASE_URL=https://n8n.cancheros.duckdns.org/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cancheros-net